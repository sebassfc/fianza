# Render Blueprint: one free web service. Render asks once for every `sync: false` value.
# Every PayPal value must come from a SANDBOX app.
# Spec: https://render.com/docs/blueprint-spec
#
# Free plan, no card on file, so three things live elsewhere:
# - Postgres: Render's free database expires 30 days after creation, before judging ends (Dec 15).
#   DATABASE_URL points to an external free Postgres instead (Neon, no expiry).
# - The 48-hour reconciler: cron jobs have no free plan. .github/workflows/reconcile.yml calls
#   POST /api/cron/reconcile every hour with CRON_SECRET (a GitHub Actions secret with the same value).
# - Wake-ups: a free instance sleeps after 15 idle minutes and takes about a minute to wake.
#   Free hours (750 a month) are shared with every free service in the workspace, so do not
#   schedule the reconciler more often than hourly: every 15 minutes would keep it awake all month.
services:
  - type: web
    name: fianza-bond
    runtime: node
    region: oregon
    plan: free
    numInstances: 1
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Straight to the Next binary: through pnpm, Corepack downloads pnpm again on every wake-up.
    startCommand: node_modules/.bin/next start -H 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: BOND_AMOUNT_USD
        value: "5.00"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: FIANZA_MONTHLY_FORFEIT_CAP
        value: "5"
      # Same value as the CRON_SECRET Actions secret: `openssl rand -hex 32`.
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      # APP_BASE_URL is optional here: the app falls back to Render's RENDER_EXTERNAL_URL.
