name: Reconcile

# Keeps the 48-hour review guarantee on Render's free plan, which has no cron jobs:
# voids holds nobody decided on. Needs the FIANZA_URL variable and the CRON_SECRET secret.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    if: vars.FIANZA_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A sleeping free instance takes about a minute to wake; wait for it before the POST.
      - name: Wake the service
        run: curl -fsS -o /dev/null --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$FIANZA_URL/"
        env:
          FIANZA_URL: ${{ vars.FIANZA_URL }}
      - name: Void overdue holds
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 90 "$FIANZA_URL/api/cron/reconcile"
        env:
          FIANZA_URL: ${{ vars.FIANZA_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
